<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B0014"/>
      <stop offset="25%" stop-color="#8B0000"/>
      <stop offset="50%" stop-color="#C0392B"/>
      <stop offset="75%" stop-color="#FF4444"/>
      <stop offset="100%" stop-color="#FF8C66"/>
    </linearGradient>
    <linearGradient id="peachGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B3D"/>
      <stop offset="50%" stop-color="#FF8C66"/>
      <stop offset="100%" stop-color="#FFB396"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB396"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FF8C66"/>
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B3D" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B0000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#FFB396" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="1200" height="280" fill="url(#skyGradient)"/>
  <rect width="1200" height="280" fill="url(#glowCenter)"/>
  <rect width="1200" height="280" fill="url(#dots)"/>
  <path d="M0 180 Q 200 120 400 160 T 800 170 T 1200 150 L 1200 280 L 0 280 Z" fill="#6B0014" opacity="0.4"/>
  <path d="M0 200 Q 300 130 600 180 T 1200 160 L 1200 280 L 0 280 Z" fill="#800020" opacity="0.5"/>
  <circle cx="100" cy="100" r="80" fill="#FF6B3D" opacity="0.08" filter="url(#glow)">
    <animate attributeName="r" values="80;100;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.08;0.15;0.08" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="180" r="60" fill="#FF4444" opacity="0.1" filter="url(#glow)">
    <animate attributeName="r" values="60;80;60" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="115" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#textGradient)" text-anchor="middle" filter="url(#textGlow)">Shivansh Dubey</text>
  <text x="600" y="170" font-family="JetBrains Mono, Consolas, monospace" font-size="26" fill="#FFB396" text-anchor="middle" opacity="0.95">Full-Stack Developer · AI Builder · Android &amp; Web Creator</text>
  <text x="600" y="210" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#FF8C66" text-anchor="middle" opacity="0.8">Python · TypeScript · Kotlin · React · Next.js · Flutter · AI/ML</text>
  <g transform="translate(600, 245)">
    <rect x="-120" y="-12" width="240" height="4" rx="2" fill="#8B0000" opacity="0.3"/>
    <rect x="-120" y="-12" width="0" height="4" rx="2" fill="url(#peachGradient)">
      <animate attributeName="width" values="0;240;0" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>