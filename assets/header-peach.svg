<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe5b4"/>
      <stop offset="50%" stop-color="#ffd9a0"/>
      <stop offset="100%" stop-color="#ffe5b4"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#670e10"/>
      <stop offset="50%" stop-color="#9c2b2e"/>
      <stop offset="100%" stop-color="#670e10"/>
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#670e10" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#670e10" stop-opacity="0"/>
    </radialGradient>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#670e10" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="280" fill="url(#bgGradient)"/>
  <rect width="1200" height="280" fill="url(#glowCenter)"/>
  <rect width="1200" height="280" fill="url(#dots)"/>
  <path d="M0 180 Q 200 130 400 165 T 800 175 T 1200 155 L 1200 280 L 0 280 Z" fill="#670e10" opacity="0.06"/>
  <path d="M0 200 Q 300 140 600 185 T 1200 165 L 1200 280 L 0 280 Z" fill="#670e10" opacity="0.08"/>
  <circle cx="100" cy="100" r="80" fill="#670e10" opacity="0.06">
    <animate attributeName="r" values="80;100;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.06;0.1;0.06" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="180" r="60" fill="#9c2b2e" opacity="0.08">
    <animate attributeName="r" values="60;80;60" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="115" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="64" font-weight="800" fill="#670e10" text-anchor="middle" filter="url(#textGlow)">Shivansh Dubey</text>
  <text x="600" y="170" font-family="JetBrains Mono, Consolas, monospace" font-size="26" fill="#670e10" text-anchor="middle" opacity="0.85">Full-Stack Developer · AI Builder · Android &amp; Web Creator</text>
  <text x="600" y="210" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#9c2b2e" text-anchor="middle" opacity="0.7">Python · TypeScript · Kotlin · React · Next.js · Flutter · AI/ML</text>
  <g transform="translate(600, 245)">
    <rect x="-120" y="-12" width="240" height="4" rx="2" fill="#670e10" opacity="0.2"/>
    <rect x="-120" y="-12" width="0" height="4" rx="2" fill="url(#accentGradient)">
      <animate attributeName="width" values="0;240;0" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>