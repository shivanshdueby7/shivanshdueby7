<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="60" viewBox="0 0 1200 60">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#6B0014"/>
      <stop offset="25%" stop-color="#FF4444"/>
      <stop offset="50%" stop-color="#FF8C66"/>
      <stop offset="75%" stop-color="#FFB396"/>
      <stop offset="100%" stop-color="#6B0014"/>
    </linearGradient>
  </defs>
  <path d="M0 30 Q 150 5 300 30 T 600 30 T 900 30 T 1200 30" stroke="url(#dividerGrad)" stroke-width="3" fill="none" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0;-1200" dur="10s" repeatCount="indefinite"/>
  </path>
  <circle cx="600" cy="30" r="8" fill="url(#dividerGrad)">
    <animate attributeName="r" values="8;15;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="30" r="5" fill="#FF6B3D" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="30" r="5" fill="#FFB396" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" begin="0.75s"/>
  </circle>
</svg>