<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe5b4"/>
      <stop offset="50%" stop-color="#ffd9a0"/>
      <stop offset="100%" stop-color="#ffe5b4"/>
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#670e10" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#670e10" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="120" fill="url(#bgGradient)"/>
  <rect width="1200" height="120" fill="url(#glowCenter)"/>
  <path d="M0 20 Q 300 8 600 15 T 1200 12 L 1200 120 L 0 120 Z" fill="#670e10" opacity="0.06"/>
  <text x="600" y="52" font-family="'Brush Script MT', 'Segoe Script', 'Comic Sans MS', cursive" font-size="30" font-weight="700" fill="#670e10" text-anchor="middle">Thanks for visiting!</text>
  <text x="600" y="80" font-family="'Brush Script MT', 'Segoe Script', 'Comic Sans MS', cursive" font-size="17" fill="#9c2b2e" text-anchor="middle" opacity="0.75">Built with passion &amp; powered by GitHub Actions</text>
  <g transform="translate(600, 102)">
    <circle cx="-40" cy="0" r="3" fill="#670e10" opacity="0.6">
      <animate attributeName="cy" values="0;-8;0" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="3" fill="#9c2b2e" opacity="0.6">
      <animate attributeName="cy" values="0;-8;0" dur="1s" repeatCount="indefinite" begin="0.15s"/>
    </circle>
    <circle cx="40" cy="0" r="3" fill="#670e10" opacity="0.6">
      <animate attributeName="cy" values="0;-8;0" dur="1s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
  </g>
</svg>