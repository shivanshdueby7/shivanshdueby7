<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120">
  <defs>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B0014"/>
      <stop offset="50%" stop-color="#8B0000"/>
      <stop offset="100%" stop-color="#FF4444"/>
    </linearGradient>
    <linearGradient id="footerTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB396"/>
      <stop offset="100%" stop-color="#FF8C66"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="120" fill="url(#footerGrad)"/>
  <path d="M0 20 Q 300 5 600 15 T 1200 10 L 1200 120 L 0 120 Z" fill="#6B0014" opacity="0.5"/>
  <text x="600" y="55" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="700" fill="url(#footerTextGrad)" text-anchor="middle">Thanks for visiting! ⭐</text>
  <text x="600" y="82" font-family="JetBrains Mono, monospace" font-size="14" fill="#FFB396" text-anchor="middle" opacity="0.8">Built with passion • Powered by GitHub Actions • Updated hourly</text>
  <g transform="translate(600, 105)">
    <circle cx="-40" cy="0" r="3" fill="#FF6B3D">
      <animate attributeName="cy" values="0;-10;0" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="3" fill="#FF8C66">
      <animate attributeName="cy" values="0;-10;0" dur="1s" repeatCount="indefinite" begin="0.15s"/>
    </circle>
    <circle cx="40" cy="0" r="3" fill="#FFB396">
      <animate attributeName="cy" values="0;-10;0" dur="1s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
  </g>
</svg>