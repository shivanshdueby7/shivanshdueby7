name: Generate All Metrics & Animations

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  metrics-classic:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          filename: metrics.svg
          template: classic
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          config_base64: yes
          config_output: svg
          base: header, activity, community, repositories, metadata
          plugin_achievements: yes
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
          plugin_introduction: yes
          plugin_introduction_title: yes
          plugin_followup: yes
          plugin_followup_sections: issues, pull-requests
          plugin_habits: yes
          plugin_habits_days: 30
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_notable: yes
          plugin_notable_repositories_limit: 5
          plugin_people: yes
          plugin_people_limit: 5
          plugin_repositories: yes
          plugin_repositories_limit: 6
          plugin_repositories_affiliations: owner, collaborator
          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: classic
          plugin_stargazers_days: 365
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 10
          plugin_lines: yes
          plugin_lines_sections: base, repositories
          plugin_lines_history_limit: 2
          plugin_licenses: yes
          plugin_licenses_threshold: 1
          plugin_code: yes
          plugin_code_loaded: 1
          plugin_calendar: yes
          plugin_calendar_duration: full-year
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  metrics-languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          filename: languages.svg
          template: classic
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          config_base64: yes
          config_output: svg
          base: ""
          plugin_languages: yes
          plugin_languages_details: percentage, bytes-size, lines-size
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: yes
          plugin_languages_indepth_custom: yes
          plugin_languages_limit: 12
          plugin_languages_threshold: 1%
          plugin_languages_colors: "{python: '#FF6B3D', javascript: '#FFB396', typescript: '#FF8C66', kotlin: '#E63946', dart: '#FF4444', java: '#800020', go: '#FF6B3D', rust: '#E63946', cpp: '#800020', html: '#FFB396', css: '#FF8C66', shell: '#FF4444'}"

  metrics-stars:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          filename: stars.svg
          template: classic
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          config_base64: yes
          config_output: svg
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 12
          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: graph
          plugin_stargazers_worldmap: yes

  metrics-skyline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          filename: skyline.svg
          template: classic
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          config_base64: yes
          config_output: svg
          base: ""
          plugin_skyline: yes
          plugin_skyline_year: 2024

  metrics-isocalendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          filename: isocalendar.svg
          template: classic
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          config_base64: yes
          config_output: svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  metrics-activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          filename: activity.svg
          template: classic
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          config_base64: yes
          config_output: svg
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 10
          plugin_activity_days: 30
          plugin_activity_filter: all
          plugin_habits: yes
          plugin_habits_days: 30
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_lines: yes
          plugin_lines_history_limit: 2

  github-motion:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate all motion animations
        uses: AcTePuKc/github-motion@main
        with:
          username: shivanshdueby7
          animation: snake,matrix,wave,glow,pulsar,rain,grow,flip,spark
          shape: square,circle,heart,diamond
          theme: unicorn,nightowl,dracula,bulgaria,tokyonight,candy,dark-bg,bulgaria-dark,india
          year: 2024
          output: dist/motion.svg

  commit-all:
    needs: [metrics-classic, metrics-languages, metrics-stars, metrics-skyline, metrics-isocalendar, metrics-activity, github-motion]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit all generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.svg dist/*.svg 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update all metrics & animations"
          git push