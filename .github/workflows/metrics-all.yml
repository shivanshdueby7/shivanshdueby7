name: Generate Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          filename: metrics.svg
          template: classic
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          config_base64: yes
          config_output: svg
          base: header, activity, community, repositories, metadata
          plugin_achievements: yes
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
          plugin_introduction: yes
          plugin_introduction_title: yes
          plugin_followup: yes
          plugin_followup_sections: issues, pull-requests
          plugin_notable: yes
          plugin_notable_repositories_limit: 5
          plugin_people: yes
          plugin_people_limit: 5
          plugin_repositories: yes
          plugin_repositories_limit: 6
          plugin_repositories_affiliations: owner, collaborator
          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: classic
          plugin_stargazers_days: 365
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 10
          plugin_lines: yes
          plugin_lines_sections: base, repositories
          plugin_lines_history_limit: 2
          plugin_licenses: yes
          plugin_licenses_setup: yes
          plugin_licenses_ratio: yes
          plugin_licenses_legal: yes
          plugin_code: yes
          plugin_code_loaded: 1

  skyline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          filename: skyline.svg
          template: classic
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          config_base64: yes
          config_output: svg
          base: ""
          plugin_skyline: yes
          plugin_skyline_year: 2025
          plugin_skyline_frames: 6
          plugin_skyline_quality: 1
          plugin_skyline_settings: |
            {
              "url": "https://honzaap.github.io/GithubCity?name=${login}&year=${year}",
              "ready": "[...document.querySelectorAll('.display-info span')].map(span => span.innerText).includes('${login}')",
              "wait": 4,
              "hide": ".github-corner, .footer-link, .buttons-options, .mobile-rotate, .display-info span:first-child"
            }
          verify: no
          delay: 120

  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: shivanshdueby7
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || git commit -m "chore: update snake animation"
          git push